[package]
name = "ai-text-replacer"
version = "0.1.0"
description = "AI-powered text transformation with global keyboard shortcuts"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "ai_text_replacer_lib"
path = "src/lib.rs"

[[bin]]
name = "ai-text-replacer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "global-shortcut-all", "shell-open", "clipboard-all", "global-shortcut", "system-tray", "window-all", "macos-private-api"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"
enigo = "0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "windef", "minwindef"] }
# Clé `Run` de l'utilisateur courant, pour le démarrage automatique.
winreg = "0.52"

# Versions alignées sur celles que Tauri 1.8 tire déjà via tao, pour éviter
# deux copies incompatibles de `objc` dans le même binaire.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[features]
# `tauri build` compile avec `--features custom-protocol` : c'est ce qui fait
# servir le frontend depuis le binaire au lieu du serveur de développement.
# Sans cette déclaration, la compilation de production échoue d'entrée.
custom-protocol = ["tauri/custom-protocol"]
